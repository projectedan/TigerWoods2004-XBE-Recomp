
# ---- Tiger Woods PGA Tour 2004 hooks (appended to game.toml) ----
[[hook]]                   # XapiInitProcess: failed disc authentication (0x110A52 < 0) -> continue instead of booting to the dashboard (0x110C8C)
at = 0x00110C8C
call = "TW_DiscCheckFailed"
on_true = 0x00110C91

[[hook]]                   # camera setup: the horizontal half-width of the view, before the side frustum planes are made from it, widened for the frame's shape
at = 0x000817ED
call = "TW_FrustumWidth"



[[hook]]                   # movie loop: the pacing spin -> paced with the wait for the display counted
at = 0x000F9543
call = "TW_MoviePace"
on_true = 0x000F9573


[[hook]]                   # movie loop: the picture's draw was issued
at = 0x000F9540
call = "TW_MovieDrawn"

[[hook]]                   # movie loop: no new picture yet, polling for the decoder's next one
at = 0x000F9598
call = "TW_MovieIdle"

[[hook]]                   # camera flight's trail: the rectangle of the last frame it reads, the whole frame like the viewport
at = 0x0007415A
call = "TW_TrailSource"

[[hook]]                   # the sun's flare: a random number for a piece's width
at = 0x0009DF1A
call = "TW_SunSteady"

[[hook]]                   # the sun's flare: a random number for a piece's height
at = 0x0009DF54
call = "TW_SunSteady"

[[hook]]                   # the sun's flare: a random number for a second set's width
at = 0x0009E30B
call = "TW_SunSteady"

[[hook]]                   # the sun's flare: a random number for a second set's height
at = 0x0009E345
call = "TW_SunSteady"

[[hook]]                   # an object's detail: its level, the level it blends to and how far, just stored for this frame
at = 0x000761DE
call = "TW_ObjectDetail"
